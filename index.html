
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="page-header">
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <main>
        <section class="expense-section">
            <h2>Add Expense</h2>

            <label for="expense-name">Expense Name:</label>
            <input type="text" id="expense-name" placeholder="e.g. Groceries">

            <label for="amount">Amount:</label>
            <input type="number" id="amount" placeholder="e.g. 500">

            <label for="category">Category:</label>
            <input type="text" id="category" placeholder="e.g. Food">
        </section>

        <section id="expenses">
            <h2>Your Expenses</h2>
            <p>No expenses yet.</p>
        </section>
    </main>

</body>
</html>
